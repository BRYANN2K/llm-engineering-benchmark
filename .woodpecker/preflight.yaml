when:
  - event: [push, pull_request, manual]

steps:
  - name: public-preflight
    image: docker.io/library/python:3.12-bookworm@sha256:14a4933e6cef421424f7a66d89a3f4eafcbd0d90e0a822251f298e05132dc735
    backend_options:
      kubernetes:
        resources:
          requests: {cpu: 500m, memory: 1Gi}
          limits: {cpu: "2", memory: 3Gi}
    commands:
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - python3 -m py_compile scripts/*.py harness/runner/runner.py runtime/hermes_tool_sandbox/sitecustomize.py
      - python3 -m json.tool suite.json >/dev/null
      - python3 -m json.tool model-roster.json >/dev/null
      - python3 -m json.tool pricing/official-pricing-2026-08-13.json >/dev/null
      - ./scripts/build-sandbox
      - |
        if unshare --user --map-root-user true 2>/dev/null; then
          ./runtime/sandbox/run-tests
        else
          echo 'CI pod blocks unprivileged user namespaces; kernel isolation proof is host-specific.'
          echo 'See proof/sandbox-kernel-tests.txt and proof/hermes-tool-sandbox-validation.json for the campaign-host evidence.'
        fi
      - python3 -m unittest discover -s harness/runner/tests -v
      - python3 -m unittest discover -s tests -v
      - if test -f freeze-manifest.public.json; then python3 scripts/verify_public_freeze.py; fi
      - |
        if test -d private_graders; then
          python3 scripts/validate_suite.py --jobs 2
          python3 scripts/validate_runner_integration.py --jobs 2
          git checkout -- runtime/sandbox/landlock-run.sha256
          python3 scripts/freeze.py verify
        else
          echo 'Hidden grader source is withheld during the active campaign; verifying committed hashes only.'
        fi
